name: QuanLyChiTieu
options:
  bundleIdPrefix: com.quanlychitieu
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 874C3KTRLN
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  QuanLyChiTieu:
    type: application
    platform: iOS
    sources:
      - path: QuanLyChiTieu
        excludes:
          - "**/*.md"
    resources:
      - QuanLyChiTieu/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quanlychitieu.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: QuanLyChiTieu/Info.plist
      properties:
        UILaunchScreen: {}
